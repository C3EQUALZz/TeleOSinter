[tox]
minversion = 4.15.0
envlist = py312, flake8, mypy
isolated_build = true

[gh-actions]
python =
    3.12: py312, mypy, flake8

[pytest]
addopts = -v --cov rsa --cov-report term-missing

[testenv]
deps = poetry
commands =
    poetry install
    poetry run pytest --doctest-modules rsa tests/

[testenv:flake8]
basepython = python3.12
deps =
    poetry
    flake8
commands =
    poetry install --no-root
    poetry run flake8 rsa tests

[testenv:mypy]
basepython = python3.12
deps =
    poetry
    mypy
commands =
    poetry install --no-root
    poetry run mypy rsa


